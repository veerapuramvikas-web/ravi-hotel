<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grand Royale | Fine Dining & Delicacies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #080a0f;
      --bg-secondary: #111520;
      --bg-card: rgba(19, 25, 38, 0.75);
      --bg-card-hover: rgba(26, 34, 52, 0.95);
      --gold-primary: #dcb059;
      --gold-light: #f7de9d;
      --gold-dark: #a27521;
      --gold-gradient: linear-gradient(135deg, #fae5aa 0%, #dcb059 50%, #99691b 100%);
      --text-main: #f0f4fa;
      --text-muted: #8c98ac;
      --accent-veg: #10b981;
      --accent-nonveg: #ef4444;
      --accent-egg: #f59e0b;
      --border-color: rgba(220, 176, 89, 0.16);
      --border-glow: rgba(220, 176, 89, 0.4);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --shadow-lux: 0 10px 30px -10px rgba(0, 0, 0, 0.8), 0 0 20px -5px rgba(220, 176, 89, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      line-height: 1.5;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(220, 176, 89, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(162, 117, 33, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, #0d111a 0%, #05070a 100%);
      background-attachment: fixed;
      padding-bottom: 120px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Top Restaurant Banner */
    header {
      text-align: center;
      padding: 45px 16px 20px;
      position: relative;
    }

    .brand-crest {
      font-size: 2.2rem;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 12px rgba(220, 176, 89, 0.4));
      display: inline-block;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(220, 176, 89, 0.08);
      border: 1px solid var(--border-color);
      padding: 5px 16px;
      border-radius: 50px;
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 10px;
    }

    .restaurant-title {
      font-family: 'Cinzel', serif;
      font-size: 2.6rem;
      font-weight: 900;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 3px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .luxury-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 18px auto 0;
      max-width: 240px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
    }

    .divider-star {
      color: var(--gold-primary);
      font-size: 0.85rem;
    }

    /* Sticky Controls Bar */
    .sticky-controls {
      position: sticky;
      top: 0;
      z-index: 99;
      background: rgba(8, 10, 15, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 12px 0 14px;
      border-bottom: 1px solid rgba(220, 176, 89, 0.14);
    }

    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      padding: 13px 18px 13px 44px;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.25s ease;
    }

    .search-box input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px rgba(220, 176, 89, 0.15);
      background: rgba(22, 28, 42, 0.95);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold-primary);
      font-size: 1.1rem;
      pointer-events: none;
    }

    .categories-wrapper {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .categories-wrapper::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50px;
      padding: 7px 16px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .category-btn:hover {
      background: rgba(220, 176, 89, 0.1);
      color: var(--gold-light);
      border-color: var(--border-color);
    }

    .category-btn.active {
      background: var(--gold-gradient);
      color: #090c12;
      font-weight: 700;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(220, 176, 89, 0.35);
    }

    /* Filter Stats */
    .menu-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 4px 10px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .status-count {
      color: var(--gold-light);
      font-weight: 700;
    }

    /* Menu Cards Grid */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
      margin-top: 6px;
    }

    .menu-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow-lux);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .menu-card:hover {
      transform: translateY(-3px);
      border-color: var(--border-glow);
      background: var(--bg-card-hover);
      box-shadow: 0 14px 34px -8px rgba(0, 0, 0, 0.9), 0 0 24px rgba(220, 176, 89, 0.15);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .item-num {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--gold-primary);
      background: rgba(220, 176, 89, 0.1);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid rgba(220, 176, 89, 0.25);
    }

    .item-meta {
      flex: 1;
      min-width: 0;
    }

    .item-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .diet-badge {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 1.5px solid;
      padding: 1px;
      border-radius: 3px;
      flex-shrink: 0;
      position: relative;
    }

    .diet-badge::after {
      content: '';
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .diet-veg { border-color: var(--accent-veg); }
    .diet-veg::after { background-color: var(--accent-veg); }
    .diet-nonveg { border-color: var(--accent-nonveg); }
    .diet-nonveg::after { background-color: var(--accent-nonveg); }
    .diet-egg { border-color: var(--accent-egg); }
    .diet-egg::after { background-color: var(--accent-egg); }

    .item-name {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-cat-tag {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: capitalize;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 10px;
    }

    .item-price {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gold-light);
    }

    /* Add to Order Button & Counter */
    .order-action {
      display: flex;
      align-items: center;
    }

    .add-btn {
      background: rgba(220, 176, 89, 0.12);
      border: 1px solid var(--border-color);
      color: var(--gold-light);
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .add-btn:hover {
      background: var(--gold-gradient);
      color: #0b0e14;
      border-color: transparent;
    }

    .qty-counter {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 50px;
      padding: 2px 6px;
    }

    .qty-counter.active {
      display: flex;
    }

    .qty-btn {
      background: none;
      border: none;
      color: var(--gold-light);
      font-size: 1.1rem;
      cursor: pointer;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-weight: bold;
    }

    .qty-btn:hover {
      background: rgba(220, 176, 89, 0.2);
    }

    .qty-num {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
      min-width: 16px;
      text-align: center;
    }

    /* Floating Order Tray / Bill Drawer */
    .order-tray-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 600px;
      background: linear-gradient(135deg, #1b2233 0%, #111522 100%);
      border: 2px solid var(--gold-primary);
      box-shadow: 0 15px 40px rgba(0,0,0,0.9), 0 0 25px rgba(220, 176, 89, 0.3);
      border-radius: 20px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      backdrop-filter: blur(16px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
    }

    .order-tray-bar.hidden {
      transform: translate(-50%, 130%);
      opacity: 0;
      pointer-events: none;
    }

    .tray-info {
      display: flex;
      flex-direction: column;
    }

    .tray-count {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tray-total {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--gold-light);
    }

    .view-bill-btn {
      background: var(--gold-gradient);
      color: #090c12;
      border: none;
      padding: 10px 22px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(220, 176, 89, 0.35);
    }

    /* Modal Sheet for Bill */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      background: #121622;
      border: 1px solid var(--border-color);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      font-size: 1.25rem;
    }

    .close-modal {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .bill-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
      font-size: 0.92rem;
    }

    .bill-item-name {
      font-weight: 500;
    }

    .bill-item-qty {
      color: var(--gold-primary);
      margin-left: 6px;
      font-size: 0.82rem;
    }

    .modal-footer {
      padding: 18px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: #0d101a;
      border-radius: 0 0 24px 24px;
    }

    .total-calc-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .total-amount {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      font-size: 1.35rem;
    }

    .clear-order-btn {
      width: 100%;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 10px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .restaurant-title { font-size: 1.9rem; }
      .menu-grid { grid-template-columns: 1fr; }
      header { padding: 30px 12px 16px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <div class="brand-crest">⚜️</div>
      <div><span class="brand-badge">✦ Culinary Excellence ✦</span></div>
      <h1 class="restaurant-title">THE GRAND ROYALE</h1>
      <p class="subtitle">Artisanal Flavors • Authentic Delicacies</p>
      <div class="luxury-divider">
        <div class="divider-line"></div>
        <span class="divider-star">◆</span>
        <div class="divider-line"></div>
      </div>
    </div>
  </header>

  <div class="sticky-controls">
    <div class="container">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search dish or price (e.g., Dosa, Biryani, 40)..." autocomplete="off">
      </div>
      <div class="categories-wrapper" id="categoryChips">
        <button class="category-btn active" data-category="all">✨ All Items (50)</button>
        <button class="category-btn" data-category="breakfast">🥞 Breakfast & Tiffins</button>
        <button class="category-btn" data-category="rice">🍚 Rice & Biryani</button>
        <button class="category-btn" data-category="snacks">🥟 Snacks & Chaat</button>
        <button class="category-btn" data-category="beverages">☕ Beverages & Juices</button>
        <button class="category-btn" data-category="desserts">🍰 Desserts & Bakery</button>
      </div>
    </div>
  </div>

  <main class="container">
    <div class="menu-status-bar">
      <div>Showing <span class="status-count" id="itemCount">50</span> delicacies</div>
      <div style="font-size: 0.78rem;">Inclusive of all taxes</div>
    </div>

    <div class="menu-grid" id="menuGrid"></div>
  </main>

  <!-- Floating Live Tray -->
  <div class="order-tray-bar hidden" id="orderTray">
    <div class="tray-info">
      <span class="tray-count"><span id="trayTotalQty">0</span> dishes chosen</span>
      <span class="tray-total" id="trayTotalPrice">₹0</span>
    </div>
    <button class="view-bill-btn" onclick="openBillModal()">
      <span>📋 Review Order</span>
    </button>
  </div>

  <!-- Bill Summary Modal -->
  <div class="modal-overlay" id="billModal" onclick="closeOnOverlay(event)">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Selected Delicacies</h3>
        <button class="close-modal" onclick="closeBillModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBillItems">
        <!-- Injected dynamically -->
      </div>
      <div class="modal-footer">
        <div class="total-calc-row">
          <span>Total Estimate</span>
          <span class="total-amount" id="modalTotalAmount">₹0</span>
        </div>
        <button class="view-bill-btn" style="width: 100%; justify-content: center;" onclick="alert('Order ready! You can show this screen to the waiter or cashier.')">
          🛎️ Confirm Order with Server
        </button>
        <button class="clear-order-btn" onclick="clearCart()">Reset Tray</button>
      </div>
    </div>
  </div>

      { no: 42, name: "Bread Toast", price: 25, cat: "breakfast", type: "veg" },
      { no: 43, name: "Pani Puri", price: 30, cat: "snacks", type: "veg" },
      { no: 44, name: "Bhel Puri", price: 30, cat: "snacks", type: "veg" },
      { no: 45, name: "Pav Bhaji", price: 50, cat: "snacks", type: "veg" },
      { no: 46, name: "Gulab Jamun", price: 20, cat: "desserts", type: "veg" },
      { no: 47, name: "Laddu", price: 20, cat: "desserts", type: "veg" },
      { no: 48, name: "Ice Cream", price: 30, cat: "desserts", type: "veg" },
      { no: 49, name: "Cake Slice", price: 30, cat: "desserts", type: "veg" },
      { no: 50, name: "Sweet Bun", price: 20, cat: "desserts", type: "veg" }
    ];

    const cart = {};
    const menuGrid = document.getElementById('menuGrid');
    const searchInput = document.getElementById('searchInput');
    const categoryChips = document.getElementById('categoryChips');
    const itemCountSpan = document.getElementById('itemCount');

    let currentCategory = 'all';
    let searchQuery = '';

    function getDietClass(type) {
      if (type === 'nonveg') return 'diet-nonveg';
      if (type === 'egg') return 'diet-egg';
      return 'diet-veg';
    }

    function updateCartUI() {
      const totalQty = Object.values(cart).reduce((a, b) => a + b, 0);
      let totalPrice = 0;
      Object.keys(cart).forEach(id => {
        const item = menuItems.find(m => m.no === parseInt(id));
        if (item) totalPrice += item.price * cart[id];
      });

      const tray = document.getElementById('orderTray');
      if (totalQty > 0) {
        tray.classList.remove('hidden');
        document.getElementById('trayTotalQty').textContent = totalQty;
        document.getElementById('trayTotalPrice').textContent = '₹' + totalPrice;
      } else {
        tray.classList.add('hidden');
      }

      // Update in card display
      menuItems.forEach(item => {
        const addBtn = document.getElementById(`addBtn-${item.no}`);
        const counter = document.getElementById(`counter-${item.no}`);
        const countSpan = document.getElementById(`countVal-${item.no}`);
        const qty = cart[item.no] || 0;

        if (addBtn && counter && countSpan) {
          if (qty > 0) {
            addBtn.style.display = 'none';
            counter.classList.add('active');
            countSpan.textContent = qty;
          } else {
            addBtn.style.display = 'block';
            counter.classList.remove('active');
          }
        }
      });
    }

    function modifyItem(no, delta) {
      cart[no] = (cart[no] || 0) + delta;
      if (cart[no] <= 0) delete cart[no];
      updateCartUI();
      if (document.getElementById('billModal').classList.contains('open')) {
        renderModalItems();
      }
    }

    function renderMenu() {
      const filtered = menuItems.filter(item => {
        const matchesCat = (currentCategory === 'all' || item.cat === currentCategory);
        const matchesQuery = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                             item.price.toString().includes(searchQuery);
        return matchesCat && matchesQuery;
      });

      itemCountSpan.textContent = filtered.length;

      menuGrid.innerHTML = filtered.map(item => {
        const qty = cart[item.no] || 0;
        return `
        <div class="menu-card">
          <div class="card-top">
            <span class="item-num">${item.no}</span>
            <div class="item-meta">
              <div class="item-title-row">
                <span class="diet-badge ${getDietClass(item.type)}"></span>
                <span class="item-name">${item.name}</span>
              </div>
              <div class="item-cat-tag">${item.cat}</div>
            </div>
          </div>
          <div class="card-bottom">
            <div class="item-price">₹${item.price}</div>
            <div class="order-action">
              <button class="add-btn" id="addBtn-${item.no}" style="${qty > 0 ? 'display:none;' : ''}" onclick="modifyItem(${item.no}, 1)">+ Add</button>
              <div class="qty-counter ${qty > 0 ? 'active' : ''}" id="counter-${item.no}">
                <button class="qty-btn" onclick="modifyItem(${item.no}, -1)">−</button>
                <span class="qty-num" id="countVal-${item.no}">${qty}</span>
                <button class="qty-btn" onclick="modifyItem(${item.no}, 1)">+</button>
              </div>
            </div>
          </div>
        </div>
      `}).join('');
    }

    function openBillModal() {
      renderModalItems();
      document.getElementById('billModal').classList.add('open');
    }

    function closeBillModal() {
      document.getElementById('billModal').classList.remove('open');
    }

    function closeOnOverlay(e) {
      if (e.target.id === 'billModal') closeBillModal();
    }

    function renderModalItems() {
      const container = document.getElementById('modalBillItems');
      const keys = Object.keys(cart);
      if (keys.length === 0) {
        container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 30px 0;">No dishes selected yet.</p>';
        document.getElementById('modalTotalAmount').textContent = '₹0';
        closeBillModal();
        return;
      }

      let total = 0;
      container.innerHTML = keys.map(id => {
        const item = menuItems.find(m => m.no === parseInt(id));
        const cost = item.price * cart[id];
        total += cost;
        return `
          <div class="bill-item-row">
            <div>
              <span class="bill-item-name">${item.name}</span>
              <span class="bill-item-qty">x ${cart[id]}</span>
            </div>
            <div style="font-weight: 600; color: var(--gold-light);">₹${cost}</div>
          </div>
        `;
      }).join('');

      document.getElementById('modalTotalAmount').textContent = '₹' + total;
    }

    function clearCart() {
      for (const k in cart) delete cart[k];
      updateCartUI();
      closeBillModal();
    }

    // Filter events
    categoryChips.addEventListener('click', (e) => {
      const btn = e.target.closest('.category-btn');
      if (!btn) return;
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.dataset.category;
      renderMenu();
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderMenu();
    });

    renderMenu();
  </script>
</body>
</html>
