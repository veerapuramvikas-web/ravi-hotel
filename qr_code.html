<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Standee & Printable Menu Card | The Grand Royale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080a0f;
      --card-bg: #111520;
      --gold-primary: #dcb059;
      --gold-light: #f7de9d;
      --gold-gradient: linear-gradient(135deg, #fae5aa 0%, #dcb059 50%, #99691b 100%);
      --text: #f3f4f6;
      --text-muted: #9ba3af;
      --border: rgba(220, 176, 89, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 30px 15px;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(220, 176, 89, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 50% 90%, rgba(17, 21, 32, 0.9) 0%, #050608 100%);
    }

    .toolbar {
      margin-bottom: 25px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 650px;
      text-align: center;
    }

    .action-btn {
      background: var(--gold-gradient);
      color: #0b0e14;
      font-weight: 700;
      border: none;
      padding: 10px 22px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(220, 176, 89, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(220, 176, 89, 0.5);
    }

    .action-btn.secondary {
      background: #1c2230;
      color: var(--gold-light);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    /* Luxury Standee Card */
    .standee-card {
      background: linear-gradient(160deg, #161c28 0%, #0e121a 100%);
      border: 2px solid var(--gold-primary);
      border-radius: 28px;
      padding: 42px 36px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.95), 0 0 40px rgba(220, 176, 89, 0.2);
    }

    .inner-border {
      position: absolute;
      inset: 10px;
      border: 1px dashed rgba(220, 176, 89, 0.4);
      border-radius: 20px;
      pointer-events: none;
    }

    .badge-top {
      display: inline-block;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: var(--gold-light);
      background: rgba(220, 176, 89, 0.12);
      border: 1px solid rgba(220, 176, 89, 0.3);
      padding: 5px 16px;
      border-radius: 50px;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: 1.9rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    /* QR Box */
    .qr-frame {
      background: #ffffff;
      padding: 16px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 255, 255, 0.15);
      border: 4px solid #f2e3bc;
      margin-bottom: 20px;
      position: relative;
    }

    .qr-frame img {
      width: 220px;
      height: 220px;
      display: block;
      margin: 0 auto;
      border-radius: 6px;
    }

    .instruction {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .instruction-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .features-pill-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      font-size: 0.72rem;
      color: var(--gold-light);
      font-weight: 600;
      border-top: 1px solid rgba(220, 176, 89, 0.2);
      padding-top: 18px;
    }

    .features-pill-row span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    @media print {
      body {
        background: white !important;
        color: black !important;
        padding: 0;
      }
      .toolbar {
        display: none !important;
      }
      .standee-card {
        box-shadow: none !important;
        border: 2px solid #333 !important;
        background: white !important;
        color: black !important;
        max-width: 100% !important;
      }
      .title {
        -webkit-text-fill-color: #111 !important;
      }
      .badge-top {
        color: #111 !important;
        border-color: #666 !important;
      }
      .tagline, .instruction-sub {
        color: #555 !important;
      }
      .instruction {
        color: #111 !important;
      }
      .features-pill-row {
        color: #333 !important;
        border-color: #ccc !important;
      }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button class="action-btn" onclick="window.print()">🖨️ Print QR Standee</button>
    <a href="menu_qr.png" download="restaurant_menu_qr.png" class="action-btn secondary">📥 Download PNG QR</a>
    <a href="index.html" target="_blank" class="action-btn secondary">📱 Open Menu</a>
  </div>

  <div class="standee-card">
    <div class="inner-border"></div>
    <span class="badge-top">✦ Contactless Dining ✦</span>
    <h1 class="title">THE GRAND ROYALE</h1>
    <p class="tagline">Fine South & Indian Delicacies</p>

    <div class="qr-frame">
      <img src="menu_qr.png" alt="Scan to view Digital Menu">
    </div>

    <h2 class="instruction">Scan with any Camera or UPI App</h2>
    <p class="instruction-sub">Browse all 50 authentic dishes, live prices, veg & non-veg options instantly on your smartphone.</p>

    <div class="features-pill-row">
      <span>✨ Instant Access</span>
      <span>•</span>
      <span>🔍 Quick Search</span>
      <span>•</span>
      <span>🌱 100% Hygienic</span>
    </div>
  </div>

</body>
</html>
